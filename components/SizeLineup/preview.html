<!-- @dsCard group="Packaging" height=290 width=960 subtitle="Every pack to scale (28px = 1 in), next to a phone" -->
<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<style>
body{margin:0;padding:24px;background:var(--paper);font-family:var(--font-text);color:var(--charcoal)}
.row{display:flex;gap:24px;align-items:flex-end}
.item{display:flex;flex-direction:column;gap:10px}
.p{box-sizing:border-box;display:flex;align-items:center;justify-content:center;overflow:hidden;box-shadow:var(--lift-lg);font:900 var(--fs) / .8 var(--font-display);letter-spacing:-.04em}
.lbl{font:700 14px/1.3 var(--font-text);color:var(--forest-ink)}
.dim{display:block;font:400 12px/1.4 var(--font-text);color:var(--slate)}
.phone{box-sizing:border-box;border:2px dashed var(--pebble);border-radius:16px;display:flex;align-items:center;justify-content:center;font:500 12px/1 var(--font-text);color:var(--slate)}
</style>
<div class="row">
 <div class="item"><div class="p" style="width:232px;height:132px;border-radius:14px;background:var(--forest-ink);color:var(--lime-voltage);--fs:72px">SHAT</div><div class="lbl">Original 40-pack<span class="dim">8.3 × 4.7 × 2 in</span></div></div>
 <div class="item"><div class="p" style="width:154px;height:105px;border-radius:10px;background:var(--spruce);color:var(--lime-voltage);--fs:48px">SHAT</div><div class="lbl">Travel Singles carton<span class="dim">5.5 × 3.75 × 2.5 in</span></div></div>
 <div class="item"><div class="p" style="width:84px;height:98px;border-radius:6px;background:var(--spruce);color:var(--lime-voltage);--fs:26px">SHAT</div><div class="lbl">Sachet<span class="dim">3 × 3.5 in</span></div></div>
 <div class="item"><div class="p" style="width:161px;height:84px;border-radius:10px;background:var(--obsidian);color:var(--lime-voltage);--fs:50px">SHAT</div><div class="lbl">The Clutch 12-pack<span class="dim">5.75 × 3 × 0.5 in</span></div></div>
 <div class="item"><div class="phone" style="width:162px;height:78px">Your phone</div><div class="lbl">For scale<span class="dim">about 5.8 × 2.8 in</span></div></div>
</div>
